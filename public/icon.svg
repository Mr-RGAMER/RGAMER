<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="50%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#09090e"/>
    </linearGradient>

    <linearGradient id="rGrad" x1="120" y1="120" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="68%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="kickGrad" x1="260" y1="280" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="256" y1="30" x2="256" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="highlightGrad" x1="160" y1="110" x2="420" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Battlestation Shield Border -->
  <polygon 
    points="256,36 452,136 452,376 256,476 60,376 60,136" 
    fill="#0d0d14" 
    stroke="url(#shieldGrad)" 
    stroke-width="12" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Inner ambient background shield -->
  <polygon 
    points="256,56 432,146 432,366 256,456 80,366 80,146" 
    fill="#08080d" 
    opacity="0.85"
  />

  <!-- Developer Brackets < > -->
  <path d="M110 200 L85 256 L110 312" stroke="#00F5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M402 200 L427 256 L402 312" stroke="#A855F7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- OFFICIAL CHISELED CYBER 'R' MONOGRAM -->
  <path 
    d="
      M 148 138
      L 178 108
      H 322
      C 382 108, 420 142, 420 197
      C 420 245, 388 276, 335 284
      L 398 382
      L 380 400
      H 318
      L 260 292
      H 214
      V 400
      H 148
      Z

      M 214 153
      V 243
      H 314
      C 345 243, 362 225, 362 197
      C 362 169, 345 153, 314 153
      Z
    " 
    fill-rule="evenodd" 
    fill="url(#rGrad)"
  />

  <!-- Kick blade secondary high-speed wing -->
  <path d="M 276 292 L 335 284 L 398 382 L 380 400 L 318 400 Z" fill="url(#kickGrad)" opacity="0.85"/>

  <!-- Top specular highlight -->
  <path d="M 174 113 H 322 C 377 113, 410 144, 410 195" stroke="url(#highlightGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Laser groove cut on kick blade -->
  <line x1="290" y1="312" x2="360" y2="385" stroke="#00F5FF" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- Cyber Power Diamond Accent (Pure Geometric, No Flowers) -->
  <rect x="390" y="95" width="24" height="24" rx="4" transform="rotate(45 402 107)" fill="#00F5FF"/>
</svg>
